<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generating image — LLMesh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .ig-spinner { width: 3rem; height: 3rem; }
        .ig-elapsed { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm mx-auto" style="max-width: 900px;">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <span>Image generation</span>
                <a href="/dashboard" class="btn btn-sm btn-outline-light">Back to Dashboard</a>
            </div>
            <div class="card-body">
                <dl class="row mb-3 small">
                    <dt class="col-sm-2 text-muted">Model</dt><dd class="col-sm-10"><code>{{ model }}</code></dd>
                    <dt class="col-sm-2 text-muted">Size</dt><dd class="col-sm-10"><code>{{ size }}</code></dd>
                    <dt class="col-sm-2 text-muted">Quality</dt><dd class="col-sm-10"><code>{{ quality }}</code></dd>
                    <dt class="col-sm-2 text-muted">Prompt</dt><dd class="col-sm-10">{{ prompt }}</dd>
                    <dt class="col-sm-2 text-muted">Node</dt><dd class="col-sm-10"><code>{{ node_id }}</code></dd>
                </dl>

                <div id="igPending" class="text-center py-5">
                    <div class="spinner-border text-success ig-spinner" role="status">
                        <span class="visually-hidden">Generating...</span>
                    </div>
                    <div class="mt-3">
                        <span id="igStatusText" class="text-muted">Queued — waiting for node to pick up the task...</span>
                    </div>
                    <div class="mt-2 ig-elapsed text-muted small">
                        Elapsed: <span id="igElapsed">0.0s</span>
                        &nbsp;·&nbsp;
                        Timeout: <span class="text-muted">{{ timeout_s }}s</span>
                    </div>
                </div>

                <div id="igDone" class="d-none"></div>

                <div id="igFailed" class="alert alert-danger d-none" role="alert">
                    <strong>Image generation failed.</strong>
                    <div id="igError" class="small mt-2 font-monospace"></div>
                </div>
            </div>
        </div>
    </div>

<script>
const TASK_URL = "/dashboard/image/{{ node_id }}/{{ task_id }}/result";
const TIMEOUT_S = {{ timeout_s }};
const startedAt = Date.now();
const elapsedEl = document.getElementById("igElapsed");
const statusEl  = document.getElementById("igStatusText");
const pendingEl = document.getElementById("igPending");
const doneEl    = document.getElementById("igDone");
const failedEl  = document.getElementById("igFailed");
const errorEl   = document.getElementById("igError");

function fmtSec(ms) { return (ms / 1000).toFixed(1) + "s"; }

function tickElapsed() {
    elapsedEl.textContent = fmtSec(Date.now() - startedAt);
}
const elapsedTimer = setInterval(tickElapsed, 100);

function renderDone(images) {
    pendingEl.classList.add("d-none");
    doneEl.classList.remove("d-none");
    doneEl.innerHTML = images.map((b64, i) => `
        <div class="mb-3">
            <img src="data:image/png;base64,${b64}" class="img-fluid border rounded" alt="Generated image ${i+1}">
            <div class="mt-2">
                <a class="btn btn-sm btn-outline-secondary" download="llmesh-{{ model }}-${i+1}.png"
                   href="data:image/png;base64,${b64}">Download PNG</a>
                <span class="text-muted small ms-2">${(b64.length * 0.75 / 1024).toFixed(1)} KB</span>
            </div>
        </div>
    `).join("");
}

function renderFailed(err) {
    pendingEl.classList.add("d-none");
    failedEl.classList.remove("d-none");
    errorEl.textContent = err || "(no detail)";
}

async function poll() {
    try {
        const r = await fetch(TASK_URL, { credentials: "same-origin" });
        if (!r.ok && r.status !== 200) {
            const body = await r.text();
            renderFailed(`HTTP ${r.status}: ${body.slice(0, 500)}`);
            clearInterval(elapsedTimer);
            return;
        }
        const data = await r.json();
        if (data.status === "pending") {
            const elapsedMs = data.elapsed_ms || (Date.now() - startedAt);
            statusEl.textContent = `Generating on ${'{{ node_id }}'} — first byte not yet returned.`;
            if (elapsedMs / 1000 >= TIMEOUT_S) {
                renderFailed(`Timed out after ${TIMEOUT_S}s. The agent may still be working; refresh in a moment.`);
                clearInterval(elapsedTimer);
                return;
            }
            setTimeout(poll, 1000);
            return;
        }
        clearInterval(elapsedTimer);
        if (data.status === "done") renderDone(data.images || []);
        else renderFailed(data.error || "unknown failure");
    } catch (e) {
        renderFailed(`Network error: ${e}`);
        clearInterval(elapsedTimer);
    }
}

poll();
</script>
</body>
</html>
