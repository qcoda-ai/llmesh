[pytest]
markers =
    docker: marks tests that require a running Docker daemon (deselect with -m "not docker")
# pytest-asyncio ≥0.24 deprecates implicit loop scope; CI hangs after pytest
# reported "passed" because the implicit session-scope loop didn't unwind.
# Pin to function-scope so each test gets a fresh loop and teardown is clean.
asyncio_default_fixture_loop_scope = function
