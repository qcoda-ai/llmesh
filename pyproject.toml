[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmesh"
version = "0.22.3"
description = "Distributed workload orchestration for AI inference across decentralized compute nodes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

# Hub + agent runtime dependencies. Sufficient to run `uvicorn lib.hub.server:app`
# and `python -m lib.agent.client`. No GUI, no build tooling, no platform-specific
# packages — installs cleanly on Linux servers.
dependencies = [
    "aiosqlite==0.20.0",
    "asyncpg==0.29.0",
    "fastapi==0.135.1",
    "httpx==0.28.1",
    "huggingface-hub==1.7.1",
    "Jinja2==3.1.6",
    "llama-cpp-python==0.3.16",
    "psutil==7.2.2",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.22",
    "uvicorn==0.41.0",
    "gunicorn==23.0.0",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
# Optional dependencies for the macOS/Windows tray-icon example
# (examples/desktop-tray/app.py). The tray client is an example, not a v0
# release feature — see decisions.md D012. pyobjc-* are macOS-only and gated
# with sys_platform markers so `pip install .[desktop]` is safe on Linux (the
# packages are skipped — the tray app obviously won't run there).
desktop = [
    "pystray==0.19.5",
    "pillow==12.1.1",
    "pyobjc-core==12.1; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa==12.1; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz==12.1; sys_platform == 'darwin'",
]

# PyInstaller build toolchain for producing the desktop binary (LLMesh.spec).
build = [
    "pyinstaller==6.19.0",
    "pyinstaller-hooks-contrib==2026.3",
]

# Test / development tooling.
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]
